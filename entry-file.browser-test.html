<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка главного файла</title><style>body{margin:0;background:#071517;color:#edf3f2;font:14px system-ui}nav{display:flex;flex-wrap:wrap;gap:8px;padding:8px}button{min-height:44px;padding:8px;background:#203d41;color:#edf3f2;border:1px solid #789397;border-radius:8px}iframe{width:100%;height:calc(100dvh - 120px);border:0}p{margin:8px}</style><nav><button id="prepare">Подготовить тестовый файл</button><button id="verify">Проверить сохранение и сборку</button><button id="reload">Перезагрузить студию</button></nav><p id="result">Ожидание</p><iframe id="studio" title="Студия" src="./index.html"></iframe><script>
const frame=document.getElementById('studio'),result=document.getElementById('result');
document.getElementById('prepare').onclick=async()=>{await new Promise(resolve=>setTimeout(resolve,500));frame.contentWindow.eval(`syncCodeToFile();state.files['flip-test.mrr']='function start() { print("ENTRY_FLIP_TEST"); }\\nfunction update(dt) { background("#122a2d"); text("Выбранный главный файл работает",20,40,"#ffffff",20); }';saveProjectLocal();renderFiles();switchTab('files');`);result.textContent='Тестовый файл готов. Назначь flip-test.mrr главным во вкладке Файлы.';};
document.getElementById('verify').onclick=()=>{try{const report=frame.contentWindow.eval(`(()=>{const p=projectData();if(p.entryFile!=='flip-test.mrr')throw Error('Сначала назначь flip-test.mrr главным кнопкой в студии');const stored=JSON.parse(localStorage.getItem('mrrcode-project-v2'));if(stored.entryFile!==p.entryFile)throw Error('Выбор не сохранён');if(!state.files['main.mrr'])throw Error('Исходный файл потерян');const html=exportGameHtml({download:false});if(!html)throw Error('Сборка не создана');const code=html.match(/<script>([\\s\\S]*?)<\\/script>/)[1];new Function(code);if(!html.includes('"entry":"flip-test.mrr"'))throw Error('Неверная точка входа сборки');if(!html.includes('function drawSpriteFrame'))throw Error('В сборке нет отражения');window.MrrCodeValidate('function update(dt) { sprite("hero",1,2,32,32,true,false); spriteAnim("hero",1,2,32,32,32,32,8,false,true); }',{projectFiles:state.files,currentFile:ENTRY_FILE});return 'Проверено: выбор сохранён; исходный файл сохранён; HTML-сборка с выбранной точкой входа и отражением создана, синтаксис и вызовы MrrCode корректны.';})()`);result.textContent=report;}catch(e){result.textContent='Ошибка: '+e.message;throw e;}};
document.getElementById('reload').onclick=()=>{frame.contentWindow.location.reload();result.textContent='Студия перезагружена; проверь метку главного файла.';};
</script></html>
